    <style>
      /* 首屏兜底样式：仅用于启动占位，避免主 CSS 到达前的白屏 */
      :root {
        --boot-bg: #0a0807;
        --boot-gold: #c5a55a;
        --boot-parchment: #f5e6c8;
        --font-heading: 'Ma Shan Zheng', 'Songti SC', 'STSong', 'SimSun', 'FangSong', serif;
        --font-body: 'Songti SC', 'STSong', 'SimSun', '宋体', 'Noto Serif CJK SC', 'Source Han Serif SC', serif;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--boot-bg);
        color: var(--boot-parchment);
        font-family: var(--font-body);
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* 启动占位（位于 #root 之外，因此不会被 React 首次渲染清掉） */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: var(--boot-bg);
        transition: opacity 0.4s ease;
      }
      #boot-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .boot-splash__title {
        font-family: var(--font-heading);
        font-size: 2rem;
        letter-spacing: 1rem;
        text-indent: 1rem;
        color: var(--boot-gold);
      }
      .boot-splash__bar {
        width: 200px;
        height: 2px;
        background: rgba(197, 165, 90, 0.2);
        overflow: hidden;
        position: relative;
      }
      .boot-splash__bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: -50%;
        width: 50%;
        height: 100%;
        background: var(--boot-gold);
        animation: boot-slide 1.4s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          left: -50%;
        }
        100% {
          left: 100%;
        }
      }
      .boot-splash__hint {
        font-size: 0.85rem;
        color: rgba(245, 230, 200, 0.45);
        letter-spacing: 0.1em;
      }
      /* 启动超时兜底（JS 加载失败时显示） */
      #boot-fallback {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10000;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        background: var(--boot-bg);
        color: var(--boot-parchment);
      }
      #boot-fallback.is-visible {
        display: flex;
      }
      #boot-fallback button {
        padding: 10px 24px;
        font: inherit;
        color: #1a1410;
        background: var(--boot-gold);
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__bar::after {
          animation: none;
          left: 0;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-splash__title">崇祯</div>
      <div class="boot-splash__bar"></div>
      <div class="boot-splash__hint">正在展开卷宗…</div>
    </div>

    <div id="boot-fallback" role="alert">
      <h2 style="margin: 0; font-size: 1.25rem">游戏未能启动</h2>
      <p style="margin: 0; max-width: 30em; line-height: 1.7; opacity: 0.8">
        脚本加载失败或浏览器不支持所需特性。请刷新页面；若仍然失败，请尝试更新浏览器或关闭无痕模式。
      </p>
      <button type="button" onclick="location.reload()">重新加载</button>
    </div>

    <noscript>
      <div style="padding: 32px; text-align: center">
        <h1 style="font-size: 1.4rem">需要启用 JavaScript</h1>
        <p style="opacity: 0.75">本游戏完全运行于浏览器端，请在浏览器设置中启用 JavaScript 后重新打开本页。</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      // 启动流程：主应用挂载（或错误界面渲染）后移除占位层。
      // 两条触发路径都要有：
      //   1. App 挂载后派发的 'app-ready'（正常路径，最快）
      //   2. #root 出现任意子节点（兜底：覆盖 ErrorBoundary 渲染错误界面、
      //      以及未来任何不走 app-ready 的渲染路径，避免 20 秒后错误界面
      //      被启动兜底层盖住）
      ;(function () {
        var splash = document.getElementById('boot-splash')
        var root = document.getElementById('root')
        var fallbackTimer = null
        var revealed = false

        function reveal() {
          if (revealed) return
          revealed = true
          if (fallbackTimer) clearTimeout(fallbackTimer)
          if (observer) observer.disconnect()
          if (!splash) return
          splash.classList.add('is-hidden')
          window.setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash)
          }, 450)
        }

        var observer = null
        if (root && window.MutationObserver) {
          observer = new MutationObserver(function () {
            if (root.childElementCount > 0) reveal()
          })
          observer.observe(root, { childList: true })
          if (root.childElementCount > 0) reveal()
        }

        window.addEventListener('app-ready', reveal, { once: true })

        // 兜底：模块加载失败 / 初始化抛错时，20 秒后给出可操作的提示，而不是永久黑屏。
        fallbackTimer = window.setTimeout(function () {
          if (revealed) return
          var fb = document.getElementById('boot-fallback')
          if (fb) fb.classList.add('is-visible')
        }, 20000)
      })()
    </script>
  </body>
